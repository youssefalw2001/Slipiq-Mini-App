name: Walk-Forward Exact Booster Optimizer

on:
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional GitHub Actions run ID from API Tennis Full Historical Odds Warehouse. Blank = latest successful run.
        required: false
        default: ''
      bankroll:
        description: Starting bankroll for drawdown/compounding simulation.
        required: false
        default: '3000'
      risk_pcts:
        description: Comma-separated risk fractions for compounding simulation.
        required: false
        default: '0.05,0.06,0.07'
      booster_stakes:
        description: Comma-separated exact-score booster stakes to test.
        required: false
        default: '0.10,0.25,0.50,1.00'
      min_train_examples:
        description: Minimum prior examples for exact-score booster selection.
        required: false
        default: '30'
      min_train_units:
        description: Minimum prior flat exact-score units for booster selection.
        required: false
        default: '0'

permissions:
  actions: read
  contents: read

jobs:
  walk-forward-exact-booster:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          echo "Downloaded artifact files:"
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/first_set_correct_score_wide_combined.csv
          echo "Combined warehouse extracted."
          ls -lh combined-warehouse

      - name: Run walk-forward exact booster optimizer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/walk-forward-exact-booster-optimizer.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/walk-forward-exact-booster-optimizer \
            --bookmaker=bet365 \
            --bankroll='${{ github.event.inputs.bankroll }}' \
            --risk-pcts='${{ github.event.inputs.risk_pcts }}' \
            --booster-stakes='${{ github.event.inputs.booster_stakes }}' \
            --min-train-examples='${{ github.event.inputs.min_train_examples }}' \
            --min-train-units='${{ github.event.inputs.min_train_units }}'

      - name: Compress walk-forward output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/walk-forward-exact-booster-optimizer
          zip -9 ../../../walk-forward-exact-booster-optimizer.zip ./*

      - name: Upload walk-forward optimizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-exact-booster-optimizer
          path: |
            walk-forward-exact-booster-optimizer.zip
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_report.md
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_summary.json
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_scenarios.csv
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_monthly.csv
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_drawdown.csv
            artifacts/output/walk-forward-exact-booster-optimizer/walk_forward_booster_rows.csv
          if-no-files-found: error
