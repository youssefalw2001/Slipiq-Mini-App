name: Azuro Historical First Set Subgraph Backtest

on:
  workflow_dispatch:
    inputs:
      source_view:
        description: Supabase source view for historical alerts
        required: false
        default: 'proof_vault_recent_receipts_v2_protected'
      limit:
        description: Max Supabase signals to backtest
        required: false
        default: '50'
      subgraph_url:
        description: Azuro data-feed subgraph URL. Defaults to Polygon data-feed.
        required: false
        default: 'https://thegraph-1.onchainfeed.org/subgraphs/name/azuro-protocol/azuro-data-feed-polygon'
      blocks_subgraph_url:
        description: Optional blocks subgraph URL for timestamp to block lookup
        required: false
        default: ''
      rpc_url:
        description: Optional JSON-RPC URL fallback for timestamp to block lookup
        required: false
        default: ''
      chain_id:
        description: Chain label for output rows
        required: false
        default: 'polygon'
      block_window_seconds:
        description: Lookback/forward window for timestamp to block lookup
        required: false
        default: '900'
      match_window_hours:
        description: Time window around match_date for game mapping
        required: false
        default: '36'
      games_first:
        description: Max games to fetch around each match window
        required: false
        default: '200'
      write_supabase:
        description: Write rows to public.azuro_historical_backtest_v1
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run historical Azuro subgraph backtest
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE_SUPABASE: ${{ github.event.inputs.write_supabase }}
          BLOCKS_SUBGRAPH_URL: ${{ github.event.inputs.blocks_subgraph_url }}
          RPC_URL: ${{ github.event.inputs.rpc_url }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing SUPABASE_URL secret"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi
          if [ -z "${BLOCKS_SUBGRAPH_URL:-}" ] && [ -z "${RPC_URL:-}" ]; then
            echo "No blocks_subgraph_url or rpc_url supplied. The v2 runner will emit BLOCK_SOURCE_MISSING artifacts instead of failing the job."
          fi
          python scripts/backtest-azuro-historical-first-set-subgraph-v2.py \
            --out-dir=artifacts/output/azuro-historical-first-set-backtest \
            --source-view="${{ github.event.inputs.source_view }}" \
            --limit="${{ github.event.inputs.limit }}" \
            --subgraph-url="${{ github.event.inputs.subgraph_url }}" \
            --blocks-subgraph-url="${BLOCKS_SUBGRAPH_URL}" \
            --rpc-url="${RPC_URL}" \
            --chain-id="${{ github.event.inputs.chain_id }}" \
            --block-window-seconds="${{ github.event.inputs.block_window_seconds }}" \
            --match-window-hours="${{ github.event.inputs.match_window_hours }}" \
            --games-first="${{ github.event.inputs.games_first }}" \
            --write-supabase="${WRITE_SUPABASE}"

      - name: Compress output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/azuro-historical-first-set-backtest
          zip -9 ../../../azuro-historical-first-set-backtest.zip ./*

      - name: Upload historical backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuro-historical-first-set-backtest
          path: |
            azuro-historical-first-set-backtest.zip
            artifacts/output/azuro-historical-first-set-backtest/azuro_historical_first_set_backtest.csv
            artifacts/output/azuro-historical-first-set-backtest/azuro_historical_first_set_backtest.json
            artifacts/output/azuro-historical-first-set-backtest/azuro_historical_first_set_backtest_summary.json
            artifacts/output/azuro-historical-first-set-backtest/sample_time_travel_queries.graphql
          if-no-files-found: error
