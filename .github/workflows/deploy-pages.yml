name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_STRIPE_CORE_CHECKOUT_URL: ${{ vars.VITE_STRIPE_CORE_CHECKOUT_URL }}
          VITE_STRIPE_QUANT_CHECKOUT_URL: ${{ vars.VITE_STRIPE_QUANT_CHECKOUT_URL }}
          VITE_TELEGRAM_PROOF_VAULT_URL: ${{ vars.VITE_TELEGRAM_PROOF_VAULT_URL }}
          VITE_TELEGRAM_CORE_INVITE_URL: ${{ vars.VITE_TELEGRAM_CORE_INVITE_URL }}
          VITE_TELEGRAM_QUANT_INVITE_URL: ${{ vars.VITE_TELEGRAM_QUANT_INVITE_URL }}
          VITE_SLIPIQ_DATA_API_URL: ${{ vars.VITE_SLIPIQ_DATA_API_URL }}
          VITE_SLIPIQ_SLIPS_API_URL: ${{ vars.VITE_SLIPIQ_SLIPS_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
