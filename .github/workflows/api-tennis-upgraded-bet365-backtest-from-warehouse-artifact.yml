name: API Tennis Upgraded Bet365 Backtest From Warehouse Artifact

on:
  workflow_run:
    workflows:
      - API Tennis Full Historical Odds Warehouse
    types:
      - completed
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional GitHub Actions run ID from API Tennis Full Historical Odds Warehouse. Blank = latest successful run.
        required: false
        default: ''
      bankroll:
        description: Starting bankroll for drawdown/compounding simulation.
        required: false
        default: '3000'
      risk_pcts:
        description: Comma-separated risk fractions for compounding simulation.
        required: false
        default: '0.05,0.06,0.07'

permissions:
  actions: read
  contents: read

jobs:
  backtest-from-warehouse-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          elif [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          echo "Downloaded artifact files:"
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/first_set_correct_score_wide_combined.csv
          echo "Combined warehouse extracted."
          ls -lh combined-warehouse

      - name: Run upgraded Bet365 protected-score backtest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backtest-upgraded-bet365-from-warehouse.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact \
            --bookmaker=bet365 \
            --bankroll='${{ github.event.inputs.bankroll || '3000' }}' \
            --risk-pcts='${{ github.event.inputs.risk_pcts || '0.05,0.06,0.07' }}'

      - name: Compress backtest output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact
          zip -9 ../../../upgraded-bet365-backtest-from-warehouse-artifact.zip ./*

      - name: Upload upgraded backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-bet365-backtest-from-warehouse-artifact
          path: |
            upgraded-bet365-backtest-from-warehouse-artifact.zip
            artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact/upgraded_bet365_report.md
            artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact/upgraded_bet365_backtest_summary.json
            artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact/upgraded_bet365_lane_split.csv
            artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact/upgraded_bet365_monthly_split.csv
            artifacts/output/upgraded-bet365-backtest-from-warehouse-artifact/upgraded_bet365_drawdown.csv
          if-no-files-found: error
