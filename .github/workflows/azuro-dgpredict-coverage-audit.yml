name: Azuro DGPredict Coverage Audit

on:
  workflow_dispatch:
    inputs:
      azuro_api_base:
        description: Azuro/Onchainfeed public REST API base URL. Do not use a Graph/blocks subgraph URL here.
        required: false
        default: 'https://api.onchainfeed.org/api/v1/public'
      app_id:
        description: Azuro app id / integration id
        required: false
        default: 'dgpredict'
      chain_id:
        description: Optional chain id, e.g. 137, 80002, etc.
        required: false
        default: ''
      environment:
        description: Optional Azuro environment name
        required: false
        default: ''
      limit:
        description: Max First Set Lab signals to audit
        required: false
        default: '50'
      min_group_stake:
        description: Minimum grouped stake for BETTABLE decision
        required: false
        default: '5'
      min_edge:
        description: Minimum Azuro grouped odds edge over baseline
        required: false
        default: '0'
      write_supabase:
        description: Write audit rows to Supabase
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  azuro-dgpredict-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Azuro/DGPredict coverage audit
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURO_API_BASE: ${{ github.event.inputs.azuro_api_base }}
          AZURO_APP_ID: ${{ github.event.inputs.app_id }}
          AZURO_CHAIN_ID: ${{ github.event.inputs.chain_id }}
          AZURO_ENVIRONMENT: ${{ github.event.inputs.environment }}
          LIMIT: ${{ github.event.inputs.limit }}
          MIN_GROUP_STAKE: ${{ github.event.inputs.min_group_stake }}
          MIN_EDGE: ${{ github.event.inputs.min_edge }}
          WRITE_SUPABASE: ${{ github.event.inputs.write_supabase }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing SUPABASE_URL secret"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi
          if echo "${AZURO_API_BASE}" | grep -qiE 'subgraph|thegraph|studio.thegraph|blocks'; then
            echo "AZURO_API_BASE must be an Azuro/Onchainfeed REST API base, not a Graph/blocks subgraph URL."
            echo "Use https://api.onchainfeed.org/api/v1/public for this workflow."
            exit 1
          fi
          node scripts/audit-azuro-dgpredict-first-set-score-coverage.mjs \
            --out=artifacts/output/azuro-dgpredict-coverage-audit \
            --azuro-api-base="${AZURO_API_BASE}" \
            --app-id="${AZURO_APP_ID}" \
            --chain-id="${AZURO_CHAIN_ID}" \
            --environment="${AZURO_ENVIRONMENT}" \
            --limit="${LIMIT}" \
            --min-group-stake="${MIN_GROUP_STAKE}" \
            --min-edge="${MIN_EDGE}" \
            --write-supabase="${WRITE_SUPABASE}"

      - name: Compress output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/azuro-dgpredict-coverage-audit
          zip -9 ../../../azuro-dgpredict-coverage-audit.zip ./*

      - name: Upload Azuro audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuro-dgpredict-coverage-audit
          path: |
            azuro-dgpredict-coverage-audit.zip
            artifacts/output/azuro-dgpredict-coverage-audit/azuro_dgpredict_coverage_report.md
            artifacts/output/azuro-dgpredict-coverage-audit/azuro_dgpredict_coverage_summary.json
            artifacts/output/azuro-dgpredict-coverage-audit/azuro_dgpredict_coverage_audit.csv
            artifacts/output/azuro-dgpredict-coverage-audit/azuro_dgpredict_coverage_audit.json
          if-no-files-found: error
