name: Azuro v3 Multichain First Set Correct Score Scan

on:
  workflow_dispatch:
    inputs:
      page_size:
        description: Subgraph page size per chain
        required: false
        default: '100'
      max_pages:
        description: Max subgraph pages per chain
        required: false
        default: '20'
      print_all_tennis_markets:
        description: Print all decoded tennis markets to logs for debugging
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - chain: gnosis
            subgraph_url: https://thegraph.azuro.org/subgraphs/name/azuro-protocol/azuro-api-gnosis-v3
          - chain: polygon
            subgraph_url: https://thegraph.azuro.org/subgraphs/name/azuro-protocol/azuro-api-polygon-v3
          - chain: arbitrum-one
            subgraph_url: https://thegraph.azuro.org/subgraphs/name/azuro-protocol/azuro-api-arbitrum-one-v3
          - chain: linea
            subgraph_url: https://thegraph.azuro.org/subgraphs/name/azuro-protocol/azuro-api-linea-v3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scanner dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save axios @azuro-org/dictionaries

      - name: Run ${{ matrix.chain }} first-set correct-score scan
        shell: bash
        env:
          AZURO_GNOSIS_SUBGRAPH_URL: ${{ matrix.subgraph_url }}
          PAGE_SIZE: ${{ github.event.inputs.page_size }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          PRINT_ALL_TENNIS_MARKETS: ${{ github.event.inputs.print_all_tennis_markets }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}"
          node scripts/find-azuro-gnosis-first-set-correct-score.mjs \
            > "artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}/results.json" || true
          if [ ! -s "artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}/results.json" ]; then
            printf '{"ok":false,"chain":"${{ matrix.chain }}","error":"scanner produced empty output"}\n' \
              > "artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}/results.json"
          fi
          cat "artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}/results.json"

      - name: Upload chain scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuro-v3-first-set-correct-score-${{ matrix.chain }}
          path: artifacts/output/azuro-v3-multichain-first-set-correct-score/${{ matrix.chain }}/results.json
          if-no-files-found: error
