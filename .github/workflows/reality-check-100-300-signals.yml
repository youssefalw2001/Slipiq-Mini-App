name: Reality Check 100-300 Signals

on:
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional API Tennis Full Historical Odds Warehouse run ID. Blank = latest successful run.
        required: false
        default: ''
      bankroll:
        description: Starting bankroll for compounding replay.
        required: false
        default: '3000'
      risk_pcts:
        description: Comma-separated risk fractions for Monte Carlo compounding.
        required: false
        default: '0.03,0.05,0.07'
      windows:
        description: Comma-separated settled-signal window sizes.
        required: false
        default: '100,200,300'
      sims:
        description: Monte Carlo simulations per model/window/risk.
        required: false
        default: '10000'

permissions:
  actions: read
  contents: read

jobs:
  reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/first_set_correct_score_wide_combined.csv
          ls -lh combined-warehouse

      - name: Run reality check
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reality-check-100-300-signals.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/reality-check-100-300-signals \
            --bankroll='${{ github.event.inputs.bankroll }}' \
            --risk-pcts='${{ github.event.inputs.risk_pcts }}' \
            --windows='${{ github.event.inputs.windows }}' \
            --sims='${{ github.event.inputs.sims }}'

      - name: Compress output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/reality-check-100-300-signals
          zip -9 ../../../reality-check-100-300-signals.zip ./*

      - name: Upload reality check artifact
        uses: actions/upload-artifact@v4
        with:
          name: reality-check-100-300-signals
          path: |
            reality-check-100-300-signals.zip
            artifacts/output/reality-check-100-300-signals/reality_check_report.md
            artifacts/output/reality-check-100-300-signals/reality_check_summary.json
            artifacts/output/reality-check-100-300-signals/reality_model_summary.csv
            artifacts/output/reality-check-100-300-signals/reality_rolling_summary.csv
            artifacts/output/reality-check-100-300-signals/reality_rolling_windows.csv
            artifacts/output/reality-check-100-300-signals/reality_monte_carlo.csv
            artifacts/output/reality-check-100-300-signals/reality_model_rows.csv
          if-no-files-found: error
