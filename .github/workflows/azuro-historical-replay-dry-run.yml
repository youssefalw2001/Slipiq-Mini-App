name: Azuro Historical Replay Dry Run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/azuro-historical-replay-dry-run.yml'
      - 'scripts/azuro-historical-replay-backtest.ts'
      - 'package.json'
  workflow_dispatch:
    inputs:
      limit:
        description: Max settled rows per score mode
        required: false
        default: '10'
      chain:
        description: Azuro chain
        required: false
        default: 'polygon'
        type: choice
        options:
          - polygon
          - gnosis
          - arbitrum
          - base
      subgraph_url:
        description: Optional full historical subgraph URL. Use this for The Graph gateway URLs.
        required: false
        default: ''
      subgraph_id:
        description: Optional The Graph decentralized subgraph ID. Requires THE_GRAPH_API_KEY secret.
        required: false
        default: ''
      write_supabase:
        description: Keep false for dry runs
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  LIMIT: ${{ github.event.inputs.limit || '10' }}
  CHAIN: ${{ github.event.inputs.chain || 'polygon' }}
  INPUT_SUBGRAPH_URL: ${{ github.event.inputs.subgraph_url || '' }}
  INPUT_SUBGRAPH_ID: ${{ github.event.inputs.subgraph_id || '' }}
  WRITE_SUPABASE: ${{ github.event.inputs.write_supabase || 'false' }}

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Resolve historical subgraph URL
        shell: bash
        env:
          THE_GRAPH_API_KEY: ${{ secrets.THE_GRAPH_API_KEY }}
        run: |
          set -u
          mkdir -p artifacts/output/azuro-historical-replay-backtest/diagnostics
          {
            echo "chain=${CHAIN}"
            echo "limit=${LIMIT}"
            echo "write_supabase=${WRITE_SUPABASE}"
            echo "has_custom_subgraph_url=$([ -n "${INPUT_SUBGRAPH_URL}" ] && echo yes || echo no)"
            echo "has_subgraph_id=$([ -n "${INPUT_SUBGRAPH_ID}" ] && echo yes || echo no)"
            echo "has_graph_api_key=$([ -n "${THE_GRAPH_API_KEY:-}" ] && echo yes || echo no)"
          } > artifacts/output/azuro-historical-replay-backtest/diagnostics/workflow_inputs.txt

          if [ -n "${INPUT_SUBGRAPH_URL}" ]; then
            echo "AZURO_HISTORICAL_SUBGRAPH_URL=${INPUT_SUBGRAPH_URL}" >> "$GITHUB_ENV"
            echo "subgraph_mode=custom_url" >> artifacts/output/azuro-historical-replay-backtest/diagnostics/workflow_inputs.txt
          elif [ -n "${INPUT_SUBGRAPH_ID}" ]; then
            if [ -z "${THE_GRAPH_API_KEY:-}" ]; then
              echo "subgraph_id was provided, but THE_GRAPH_API_KEY secret is missing." | tee artifacts/output/azuro-historical-replay-backtest/diagnostics/config_error.txt
              echo "AZURO_HISTORICAL_SUBGRAPH_URL=" >> "$GITHUB_ENV"
              echo "subgraph_mode=missing_graph_api_key" >> artifacts/output/azuro-historical-replay-backtest/diagnostics/workflow_inputs.txt
            else
              echo "AZURO_HISTORICAL_SUBGRAPH_URL=https://gateway-market.thegraph.com/api/${THE_GRAPH_API_KEY}/subgraphs/id/${INPUT_SUBGRAPH_ID}" >> "$GITHUB_ENV"
              echo "subgraph_mode=gateway_subgraph_id" >> artifacts/output/azuro-historical-replay-backtest/diagnostics/workflow_inputs.txt
            fi
          else
            echo "AZURO_HISTORICAL_SUBGRAPH_URL=" >> "$GITHUB_ENV"
            echo "subgraph_mode=script_default_hosted_url" >> artifacts/output/azuro-historical-replay-backtest/diagnostics/workflow_inputs.txt
          fi

      - name: Run Protected 3 historical replay safely
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          mkdir -p artifacts/output/azuro-historical-replay-backtest/protected3
          EXTRA_ARGS=""
          if [ -n "${AZURO_HISTORICAL_SUBGRAPH_URL:-}" ]; then
            EXTRA_ARGS="--subgraph-url=${AZURO_HISTORICAL_SUBGRAPH_URL}"
          fi
          npm run backtest:azuro:historical -- \
            --chain="${CHAIN}" \
            --score-mode=protected3 \
            --limit="${LIMIT}" \
            --write-supabase="${WRITE_SUPABASE}" \
            ${EXTRA_ARGS} \
            --out=artifacts/output/azuro-historical-replay-backtest/protected3 \
            > artifacts/output/azuro-historical-replay-backtest/protected3/stdout.log 2> artifacts/output/azuro-historical-replay-backtest/protected3/stderr.log
          status=$?
          echo "exit_code=${status}" > artifacts/output/azuro-historical-replay-backtest/protected3/exit_code.txt
          cat artifacts/output/azuro-historical-replay-backtest/protected3/stdout.log || true
          cat artifacts/output/azuro-historical-replay-backtest/protected3/stderr.log || true
          exit 0

      - name: Run Gate-2 historical replay safely
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          mkdir -p artifacts/output/azuro-historical-replay-backtest/gate2
          EXTRA_ARGS=""
          if [ -n "${AZURO_HISTORICAL_SUBGRAPH_URL:-}" ]; then
            EXTRA_ARGS="--subgraph-url=${AZURO_HISTORICAL_SUBGRAPH_URL}"
          fi
          npm run backtest:azuro:historical -- \
            --chain="${CHAIN}" \
            --score-mode=gate2 \
            --limit="${LIMIT}" \
            --write-supabase="${WRITE_SUPABASE}" \
            ${EXTRA_ARGS} \
            --out=artifacts/output/azuro-historical-replay-backtest/gate2 \
            > artifacts/output/azuro-historical-replay-backtest/gate2/stdout.log 2> artifacts/output/azuro-historical-replay-backtest/gate2/stderr.log
          status=$?
          echo "exit_code=${status}" > artifacts/output/azuro-historical-replay-backtest/gate2/exit_code.txt
          cat artifacts/output/azuro-historical-replay-backtest/gate2/stdout.log || true
          cat artifacts/output/azuro-historical-replay-backtest/gate2/stderr.log || true
          exit 0

      - name: Upload historical replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azuro-historical-replay-dry-run-${{ env.CHAIN }}-${{ env.LIMIT }}
          path: artifacts/output/azuro-historical-replay-backtest
          if-no-files-found: error
