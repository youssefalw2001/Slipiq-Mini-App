name: API Tennis Live First Set Lab Scanner

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: Send Telegram messages through Supabase duplicate guard. Set false only for dry-run testing.
        required: false
        default: 'true'
      date_start:
        description: Start date YYYY-MM-DD. Blank = today UTC.
        required: false
        default: ''
      date_stop:
        description: Stop date YYYY-MM-DD. Blank = today+2 UTC.
        required: false
        default: ''
      max_minutes_to_start:
        description: Maximum minutes before match start to scan.
        required: false
        default: '2160'
      min_minutes_to_start:
        description: Minimum minutes before match start. Use 0 for pre-match only.
        required: false
        default: '0'
      event_type_keys:
        description: ATP/WTA event type keys.
        required: false
        default: '265,266'
      core_daily_cap:
        description: Core exact-score edge signals per day cap.
        required: false
        default: '10'
      vip_daily_cap:
        description: VIP exact-score edge signals per day cap.
        required: false
        default: '5'
      core_comfort_daily_cap:
        description: Core comfort signals per day cap.
        required: false
        default: '1'
      vip_comfort_daily_cap:
        description: VIP comfort signals per day cap.
        required: false
        default: '2'
  schedule:
    - cron: '17 */2 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply public scanner V2 protected-score upgrades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/api_tennis_live_first_set_lab_scanner.mjs')
          text = path.read_text()

          text = text.replace(
              "CORE_P1_ATP_GS_BET365: { hit: 0.3934, roi: 0.1704, sample: 544 },",
              "CORE_P1_ATP_GS_BET365: { hit: 0.3934, roi: 0.1704, sample: 544 },\n    CORE_P2_GS_REVERSE_STRETCH_BET365: { hit: 0.3824, roi: 0.3907, sample: 136 },"
          )

          old_core = "{ key: 'CORE_P1_ATP_GS_BET365', access: 'CORE_AND_VIP', books: ['bet365'], scores: ['6:3', '6:4'], sideText: 'Player 1 wins first set 6:3 or 6:4', triggerScore: '6:4', triggerMin: 5.00, triggerMax: 6.25, minGrouped: 2.50, maxGrouped: null, tierFloorA: 2.50, tierFloorS: 3.10, tour: 'ATP', tournamentGroup: 'GRAND_SLAM', publicLabel: 'Core Cluster', quality: 4 },"
          new_core = "{ key: 'CORE_P1_ATP_GS_BET365', access: 'CORE_AND_VIP', books: ['bet365'], scores: ['6:2', '6:3', '6:4'], qualifyingScores: ['6:3', '6:4'], sideText: 'Player 1 wins first set 6:2, 6:3, or 6:4', triggerScore: '6:4', triggerMin: 5.00, triggerMax: 6.25, minGrouped: 2.50, maxGrouped: null, tierFloorA: 2.50, tierFloorS: 3.10, tour: 'ATP', tournamentGroup: 'GRAND_SLAM', publicLabel: 'Core Cluster', quality: 4 },"
          text = text.replace(old_core, new_core)

          old_reverse = "{ key: 'RESEARCH_P2_GS_26_46_BET365', access: 'RESEARCH_ONLY', books: ['bet365'], scores: ['2:6', '4:6'], sideText: 'Player 2 wins first set 2:6 or 4:6', triggerScore: '', triggerMin: null, triggerMax: null, minGrouped: 2.50, maxGrouped: 4.50, requiredSkew: 'EXTREME', tierFloorA: 2.50, tierFloorS: 3.50, tour: 'ANY', tournamentGroup: 'GRAND_SLAM', publicLabel: 'Research P2 GS Sniper', quality: 1 },"
          new_reverse = "{ key: 'CORE_P2_GS_REVERSE_STRETCH_BET365', access: 'CORE_AND_VIP', books: ['bet365'], scores: ['2:6', '4:6', '5:7'], qualifyingScores: ['2:6', '4:6'], sideText: 'Player 2 wins first set 2:6, 4:6, or 5:7', triggerScore: '', triggerMin: null, triggerMax: null, minGrouped: 2.50, maxGrouped: 4.50, requiredSkew: 'EXTREME', tierFloorA: 2.50, tierFloorS: 3.50, tour: 'ANY', tournamentGroup: 'GRAND_SLAM', publicLabel: 'Reverse Stretch Cluster', quality: 4 },"
          text = text.replace(old_reverse, new_reverse)

          old_block = "\n".join([
              "    const seenBooks = allBookmakersForScores(market, lane.scores);",
              "    for (const book of lane.books) {",
              "      if (!seenBooks.includes(book)) continue;",
              "      const odds = getBookOdds(market, lane.scores, book);",
              "      if (odds.some((v) => !v || v <= 1)) continue;",
              "      const grouped = groupedOdds(odds);",
              "      if (!grouped || grouped < lane.minGrouped) continue;",
              "      if (lane.maxGrouped && grouped > lane.maxGrouped) continue;",
              "      const skew = scoreSkewBucket(odds);",
              "      if (lane.requiredSkew && skew !== lane.requiredSkew) continue;",
              "      let triggerOdds = '';",
              "      if (lane.triggerScore) {",
              "        triggerOdds = safeNumber(market?.[lane.triggerScore]?.[book]);",
              "        if (!triggerOdds || triggerOdds < lane.triggerMin || triggerOdds > lane.triggerMax) continue;",
              "      }",
              "      const tier = tierFor(grouped, lane);",
              "      const hist = historicalStatsForLane(lane.key);",
              "      const be = breakEven(grouped);",
              "      const edge = hist.hit !== null && be !== null ? hist.hit - be : null;",
          ])
          new_block = "\n".join([
              "    const qualifyingScores = lane.qualifyingScores || lane.scores;",
              "    const seenBooks = allBookmakersForScores(market, qualifyingScores);",
              "    for (const book of lane.books) {",
              "      if (!seenBooks.includes(book)) continue;",
              "      const qualifyingOdds = getBookOdds(market, qualifyingScores, book);",
              "      if (qualifyingOdds.some((v) => !v || v <= 1)) continue;",
              "      const qualifyingGrouped = groupedOdds(qualifyingOdds);",
              "      if (!qualifyingGrouped || qualifyingGrouped < lane.minGrouped) continue;",
              "      if (lane.maxGrouped && qualifyingGrouped > lane.maxGrouped) continue;",
              "      const skew = scoreSkewBucket(qualifyingOdds);",
              "      if (lane.requiredSkew && skew !== lane.requiredSkew) continue;",
              "      const odds = getBookOdds(market, lane.scores, book);",
              "      if (odds.some((v) => !v || v <= 1)) continue;",
              "      const grouped = groupedOdds(odds);",
              "      if (!grouped) continue;",
              "      let triggerOdds = '';",
              "      if (lane.triggerScore) {",
              "        triggerOdds = safeNumber(market?.[lane.triggerScore]?.[book]);",
              "        if (!triggerOdds || triggerOdds < lane.triggerMin || triggerOdds > lane.triggerMax) continue;",
              "      }",
              "      const tier = tierFor(qualifyingGrouped, lane);",
              "      const hist = historicalStatsForLane(lane.key);",
              "      const be = breakEven(grouped);",
              "      const edge = hist.hit !== null && be !== null ? hist.hit - be : null;",
          ])
          if old_block not in text:
              raise SystemExit('Exact-score gate block not found')
          text = text.replace(old_block, new_block)

          old_json_line = "trigger_odds: triggerOdds, score_odds_json: JSON.stringify({ ...Object.fromEntries(lane.scores.map((s, i) => [s, odds[i]])), market_skew_bucket: skew }),"
          new_json_line = "trigger_odds: triggerOdds, score_odds_json: JSON.stringify({ ...Object.fromEntries(lane.scores.map((s, i) => [s, odds[i]])), qualifying_scores: qualifyingScores.join('/'), qualifying_grouped_odds: qualifyingGrouped, protected_grouped_odds: grouped, market_skew_bucket: skew }),"
          if old_json_line not in text:
              raise SystemExit('Score odds JSON line not found')
          text = text.replace(old_json_line, new_json_line)

          if "qualifyingScores: ['6:3', '6:4']" not in text:
              raise SystemExit('Core qualifying gate not applied')
          if "minGrouped: 2.50" not in text:
              raise SystemExit('Original minimum grouped odds floor missing')
          if "qualifyingGrouped" not in text:
              raise SystemExit('Qualifying grouped logic missing')
          if "scores: ['2:6', '4:6', '5:7']" not in text or "qualifyingScores: ['2:6', '4:6']" not in text:
              raise SystemExit('Reverse protected-score gate not applied')

          path.write_text(text)
          PY

      - name: Generate live First Set Lab signals
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          APITENNIS_API_KEY: ${{ secrets.APITENNIS_API_KEY }}
          API_TENNIS_API_KEY: ${{ secrets.API_TENNIS_API_KEY }}
          API_TENNIS_DATE_START: ${{ github.event.inputs.date_start }}
          API_TENNIS_DATE_STOP: ${{ github.event.inputs.date_stop }}
          API_TENNIS_EVENT_TYPE_KEYS: ${{ github.event.inputs.event_type_keys }}
          MAX_MINUTES_TO_START: ${{ github.event.inputs.max_minutes_to_start }}
          MIN_MINUTES_TO_START: ${{ github.event.inputs.min_minutes_to_start }}
          CORE_DAILY_CAP: ${{ github.event.inputs.core_daily_cap }}
          VIP_DAILY_CAP: ${{ github.event.inputs.vip_daily_cap }}
          CORE_COMFORT_DAILY_CAP: ${{ github.event.inputs.core_comfort_daily_cap }}
          VIP_COMFORT_DAILY_CAP: ${{ github.event.inputs.vip_comfort_daily_cap }}
        shell: bash
        run: |
          ARGS=(
            --out=artifacts/output/api-tennis-live-first-set-lab-scanner
            --send-telegram=false
          )
          if [ -n "${API_TENNIS_DATE_START}" ]; then
            ARGS+=(--date-start="${API_TENNIS_DATE_START}")
          fi
          if [ -n "${API_TENNIS_DATE_STOP}" ]; then
            ARGS+=(--date-stop="${API_TENNIS_DATE_STOP}")
          fi
          if [ -n "${MAX_MINUTES_TO_START}" ]; then
            ARGS+=(--max-minutes-to-start="${MAX_MINUTES_TO_START}")
          fi
          if [ -n "${MIN_MINUTES_TO_START}" ]; then
            ARGS+=(--min-minutes-to-start="${MIN_MINUTES_TO_START}")
          fi
          if [ -n "${CORE_DAILY_CAP}" ]; then
            ARGS+=(--core-daily-cap="${CORE_DAILY_CAP}")
          fi
          if [ -n "${VIP_DAILY_CAP}" ]; then
            ARGS+=(--vip-daily-cap="${VIP_DAILY_CAP}")
          fi
          if [ -n "${CORE_COMFORT_DAILY_CAP}" ]; then
            ARGS+=(--core-comfort-daily-cap="${CORE_COMFORT_DAILY_CAP}")
          fi
          if [ -n "${VIP_COMFORT_DAILY_CAP}" ]; then
            ARGS+=(--vip-comfort-daily-cap="${VIP_COMFORT_DAILY_CAP}")
          fi
          node scripts/api_tennis_live_first_set_lab_scanner.mjs "${ARGS[@]}"

      - name: Deliver through Supabase duplicate guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CORE_CHAT_ID: ${{ secrets.TELEGRAM_CORE_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
          MANUAL_SEND_TELEGRAM: ${{ github.event.inputs.send_telegram }}
          REQUIRE_SUPABASE_FOR_SEND: 'true'
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            EFFECTIVE_SEND_TELEGRAM=true
          else
            EFFECTIVE_SEND_TELEGRAM="${MANUAL_SEND_TELEGRAM:-true}"
          fi

          echo "Effective Telegram sending: ${EFFECTIVE_SEND_TELEGRAM}"

          node scripts/first_set_lab_supabase_deliver.mjs \
            --input=artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_signals.csv \
            --out=artifacts/output/api-tennis-live-first-set-lab-scanner \
            --send-telegram="${EFFECTIVE_SEND_TELEGRAM}" \
            --require-supabase-for-send=true

      - name: Upload live First Set Lab artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tennis-live-first-set-lab-scanner
          path: |
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_report.md
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_summary.json
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_signals.csv
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_raw_candidates.csv
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_telegram_log.csv
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_live_fatal_error.json
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_supabase_delivery_report.md
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_supabase_delivery_summary.json
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_supabase_delivery_log.csv
            artifacts/output/api-tennis-live-first-set-lab-scanner/first_set_lab_supabase_delivery_fatal_error.json
          if-no-files-found: warn
