name: API Tennis Warehouse Coverage Audit

on:
  workflow_run:
    workflows:
      - API Tennis Full Historical Odds Warehouse
    types:
      - completed
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional GitHub Actions run ID from API Tennis Full Historical Odds Warehouse. Blank = latest successful run.
        required: false
        default: ''
      bookmaker:
        description: Bookmaker to audit inside first-set correct-score warehouse rows.
        required: false
        default: 'bet365'

permissions:
  actions: read
  contents: read

jobs:
  coverage-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          elif [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/fixtures_full_combined.csv
          test -f combined-warehouse/first_set_correct_score_wide_combined.csv
          ls -lh combined-warehouse

      - name: Run coverage audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-api-tennis-warehouse-coverage.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/api-tennis-warehouse-coverage-audit \
            --bookmaker='${{ github.event.inputs.bookmaker || 'bet365' }}'

      - name: Compress coverage audit output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/api-tennis-warehouse-coverage-audit
          zip -9 ../../../api-tennis-warehouse-coverage-audit-output.zip ./*

      - name: Upload coverage audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-tennis-warehouse-coverage-audit-output
          path: |
            api-tennis-warehouse-coverage-audit-output.zip
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_report.md
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_summary.json
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_lane_funnel.csv
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_rejections.csv
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_monthly.csv
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_bookmaker_coverage.csv
            artifacts/output/api-tennis-warehouse-coverage-audit/coverage_audit_accepted_rows.csv
          if-no-files-found: error
