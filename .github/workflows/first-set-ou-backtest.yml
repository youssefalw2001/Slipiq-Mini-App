name: First Set Over Under Backtest

on:
  workflow_run:
    workflows:
      - API Tennis Full Historical Odds Warehouse
    types:
      - completed
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional GitHub Actions run ID from API Tennis Full Historical Odds Warehouse. Blank = latest successful run.
        required: false
        default: ''
      bookmaker:
        description: Optional bookmaker filter. Blank = all books.
        required: false
        default: ''
      min_odds:
        description: Minimum decimal odds to include.
        required: false
        default: '1.01'
      max_odds:
        description: Maximum decimal odds to include.
        required: false
        default: '1000'

permissions:
  actions: read
  contents: read

jobs:
  first-set-ou-backtest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          elif [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/odds_full_long_combined.csv
          ls -lh combined-warehouse

      - name: Run first set over under backtest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backtest-first-set-ou-from-warehouse.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/first-set-ou-backtest \
            --bookmaker='${{ github.event.inputs.bookmaker }}' \
            --min-odds='${{ github.event.inputs.min_odds || '1.01' }}' \
            --max-odds='${{ github.event.inputs.max_odds || '1000' }}'

      - name: Compress O/U backtest output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/first-set-ou-backtest
          zip -9 ../../../first-set-ou-backtest-output.zip ./*

      - name: Upload O/U backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-set-ou-backtest-output
          path: |
            first-set-ou-backtest-output.zip
            artifacts/output/first-set-ou-backtest/first_set_ou_report.md
            artifacts/output/first-set-ou-backtest/first_set_ou_summary.json
            artifacts/output/first-set-ou-backtest/first_set_ou_rows.csv
            artifacts/output/first-set-ou-backtest/first_set_ou_by_side.csv
            artifacts/output/first-set-ou-backtest/first_set_ou_by_line.csv
            artifacts/output/first-set-ou-backtest/first_set_ou_by_bookmaker.csv
            artifacts/output/first-set-ou-backtest/first_set_ou_by_month.csv
          if-no-files-found: error
