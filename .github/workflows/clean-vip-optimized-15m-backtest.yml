name: Clean VIP Optimized 15M Backtest

on:
  workflow_dispatch:
    inputs:
      warehouse_run_id:
        description: Optional API Tennis Full Historical Odds Warehouse run ID. Blank = latest successful run.
        required: false
        default: ''
      bankroll:
        description: Starting bankroll for compounding replay.
        required: false
        default: '3000'
      risk_pct:
        description: Risk fraction for compounding replay.
        required: false
        default: '0.05'

permissions:
  actions: read
  contents: read

jobs:
  clean-vip-optimized-15m:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve warehouse run id
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.warehouse_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_RUN_ID:-}" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow="api-tennis-full-historical-odds-warehouse.yml" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve warehouse run id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using warehouse run id: $RUN_ID"

      - name: Download combined warehouse artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p warehouse-artifact
          gh run download "$RUN_ID" \
            --name api-tennis-full-historical-odds-warehouse-combined \
            --dir warehouse-artifact
          find warehouse-artifact -maxdepth 2 -type f -print

      - name: Extract combined warehouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-warehouse
          ZIP_PATH="warehouse-artifact/api-tennis-full-historical-odds-warehouse-combined.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            ZIP_PATH=$(find warehouse-artifact -name 'api-tennis-full-historical-odds-warehouse-combined.zip' -type f | head -n 1)
          fi
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "Combined warehouse zip not found."
            find warehouse-artifact -type f -print
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d combined-warehouse
          test -f combined-warehouse/first_set_correct_score_wide_combined.csv
          ls -lh combined-warehouse

      - name: Run clean VIP optimized backtest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backtest-clean-vip-optimized-15m-from-warehouse.mjs \
            --warehouse-dir=combined-warehouse \
            --out=artifacts/output/clean-vip-optimized-15m \
            --bookmaker=bet365 \
            --bankroll='${{ github.event.inputs.bankroll }}' \
            --risk-pct='${{ github.event.inputs.risk_pct }}'

      - name: Compress output
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/output/clean-vip-optimized-15m
          zip -9 ../../../clean-vip-optimized-15m-backtest.zip ./*

      - name: Upload clean VIP optimized artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-vip-optimized-15m-backtest
          path: |
            clean-vip-optimized-15m-backtest.zip
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_report.md
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_summary.json
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_summary.csv
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_monthly.csv
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_drawdown.csv
            artifacts/output/clean-vip-optimized-15m/clean_vip_optimized_rows.csv
          if-no-files-found: error
